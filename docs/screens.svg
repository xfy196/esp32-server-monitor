<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="440" viewBox="0 0 1360 440"
     font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif">

  <rect width="1360" height="440" fill="#f4f6fb"/>
  <circle cx="1300" cy="60" r="130" fill="#e8edfb" opacity="0.6"/>

  <text x="56" y="62" font-size="26" font-weight="700" fill="#0f172a">OLED 显示界面 · 128×64</text>
  <text x="56" y="88" font-size="14" fill="#64748b">每 7 秒自动翻页 · 按板载 BOOT 键手动切换</text>

  <!-- ================= 页面 1 ================= -->
  <g transform="translate(56,120)">
    <rect width="400" height="208" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <rect x="8" y="8" width="384" height="192" fill="#05080f"/>

    <g font-family="Menlo,Consolas,'Courier New',monospace" font-size="21" fill="#e2e8f0">
      <!-- 顶部 -->
      <text x="8" y="23" textLength="72">srv1</text>
      <g fill="#e2e8f0">
        <rect x="347" y="18" width="9" height="6"/>
        <rect x="359" y="12" width="9" height="12"/>
        <rect x="371" y="6" width="9" height="18"/>
        <rect x="383" y="0" width="9" height="24"/>
      </g>
      <line x1="8" y1="31" x2="392" y2="31" stroke="#94a3b8" stroke-width="2.5"/>

      <!-- CPU -->
      <text x="8" y="51" textLength="54">CPU</text>
      <text x="392" y="51" textLength="90" text-anchor="end">42.5%</text>

      <rect x="8" y="63" width="378" height="18" fill="none" stroke="#94a3b8" stroke-width="3"/>
      <rect x="11" y="66" width="160" height="12" fill="#e2e8f0"/>

      <text x="8" y="102" textLength="288">4core  load 0.42</text>

      <!-- MEM -->
      <text x="8" y="132" textLength="54">MEM</text>
      <text x="392" y="132" textLength="90" text-anchor="end">56.1%</text>

      <rect x="8" y="144" width="378" height="18" fill="none" stroke="#94a3b8" stroke-width="3"/>
      <rect x="11" y="147" width="212" height="12" fill="#e2e8f0"/>

      <text x="8" y="183" textLength="216">4.5 / 8.0 GB</text>
    </g>
  </g>
  <text x="256" y="358" font-size="14" fill="#334155" text-anchor="middle">页面 1 · CPU / 内存</text>

  <!-- ================= 页面 2 ================= -->
  <g transform="translate(486,120)">
    <rect width="400" height="208" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <rect x="8" y="8" width="384" height="192" fill="#05080f"/>

    <g font-family="Menlo,Consolas,'Courier New',monospace" font-size="21" fill="#e2e8f0">
      <text x="8" y="23" textLength="72">srv1</text>
      <g fill="#e2e8f0">
        <rect x="347" y="18" width="9" height="6"/>
        <rect x="359" y="12" width="9" height="12"/>
        <rect x="371" y="6" width="9" height="18"/>
        <rect x="383" y="0" width="9" height="24"/>
      </g>
      <line x1="8" y1="31" x2="392" y2="31" stroke="#94a3b8" stroke-width="2.5"/>

      <text x="8" y="51" textLength="72">DISK</text>
      <text x="392" y="51" textLength="90" text-anchor="end">63.0%</text>

      <rect x="8" y="63" width="378" height="18" fill="none" stroke="#94a3b8" stroke-width="3"/>
      <rect x="11" y="66" width="238" height="12" fill="#e2e8f0"/>

      <text x="8" y="98" textLength="252">20.2 / 32.0 GB</text>

      <text x="8" y="129" textLength="36">RX</text>
      <text x="392" y="129" textLength="162" text-anchor="end">1.24 MB/s</text>

      <text x="8" y="159" textLength="36">TX</text>
      <text x="392" y="159" textLength="162" text-anchor="end">0.31 MB/s</text>

      <text x="8" y="189" textLength="36">UP</text>
      <text x="392" y="189" textLength="90" text-anchor="end">3d 04h</text>
    </g>
  </g>
  <text x="686" y="358" font-size="14" fill="#334155" text-anchor="middle">页面 2 · 磁盘 / 网络</text>

  <!-- ================= 页面 3 ================= -->
  <g transform="translate(916,120)">
    <rect width="400" height="208" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <rect x="8" y="8" width="384" height="192" fill="#05080f"/>

    <g font-family="Menlo,Consolas,'Courier New',monospace" font-size="21" fill="#e2e8f0">
      <text x="8" y="23" textLength="72">srv1</text>
      <g fill="#e2e8f0">
        <rect x="347" y="18" width="9" height="6"/>
        <rect x="359" y="12" width="9" height="12"/>
        <rect x="371" y="6" width="9" height="18"/>
        <rect x="383" y="0" width="9" height="24"/>
      </g>
      <line x1="8" y1="31" x2="392" y2="31" stroke="#94a3b8" stroke-width="2.5"/>

      <text x="8" y="51" textLength="36">IP</text>
      <text x="392" y="51" textLength="216" text-anchor="end">192.168.1.50</text>

      <text x="8" y="78" textLength="72">RSSI</text>
      <text x="392" y="78" textLength="126" text-anchor="end">-58 dBm</text>

      <text x="8" y="105" textLength="108">UPTIME</text>
      <text x="392" y="105" textLength="108" text-anchor="end">3d 04h</text>

      <text x="8" y="132" textLength="72">LOAD</text>
      <text x="392" y="132" textLength="252" text-anchor="end">0.42 0.51 0.38</text>

      <text x="8" y="159" textLength="72">TEMP</text>
      <text x="392" y="159" textLength="108" text-anchor="end">48.6 C</text>

      <text x="8" y="186" textLength="54">API</text>
      <text x="392" y="186" textLength="90" text-anchor="end">12 ms</text>
    </g>
  </g>
  <text x="1116" y="358" font-size="14" fill="#334155" text-anchor="middle">页面 3 · 系统信息</text>

  <text x="56" y="404" font-size="11" fill="#94a3b8">服务器离线时，顶部会显示反色的 OFFLINE 提示条；数据每 5 秒刷新一次，仪表条带平滑动画。</text>
</svg>
