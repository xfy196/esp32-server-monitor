; PlatformIO 项目配置
; 板子：ESP32 DevKit V1（WROOM-32，30/38 针都适用）
;
;   pio run -t upload && pio device monitor
;
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.17.0
    bblanchon/ArduinoJson @ ^7.2.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall

; 如果你用的是 ESP32-S3 / C3，把上面的 board 换成对应型号即可，
; 例如 board = esp32-s3-devkitc-1，并在 config.h 里改 I2C 引脚。
