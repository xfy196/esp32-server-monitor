; PlatformIO 项目配置
;
;   ESP32-C3 SuperMini：  pio run -e esp32c3 -t upload && pio device monitor
;   ESP32 DevKit V1：     pio run -e esp32dev -t upload && pio device monitor
;
; 引脚在 src/config.h 里按芯片自动切换，换板子不用改代码。

[platformio]
default_envs = esp32dev

; ---------------- 公共部分 ----------------
[env]
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit BusIO @ ^1.17.0
    bblanchon/ArduinoJson @ ^7.2.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Wall

; ---------------- ESP32 DevKit V1（WROOM-32）----------------
; I2C: SDA=GPIO21  SCL=GPIO22
[env:esp32dev]
platform = espressif32
board = esp32dev
upload_speed = 921600

; ---------------- ESP32-C3 SuperMini ----------------
; I2C: SDA=IO4  SCL=IO5    BOOT 键 = IO9
; 板载原生 USB-C（无 CH340），必须开 USB CDC，否则看不到串口日志
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
upload_speed = 460800
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
